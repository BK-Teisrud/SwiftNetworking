name: Networking
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.0', '26.2']
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift Tools/RepositoryTools.swift sync --check
      - run: swift --version
      - run: swift test
      - if: matrix.xcode == '26.2'
        run: xcrun swift-format lint --strict --recursive Package.swift Sources Tests Tools
      - if: matrix.xcode == '26.2'
        run: swift Tools/RepositoryTools.swift distribution
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests on an available iPhone simulator
        run: swift Tools/RepositoryTools.swift ios-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-test-results
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/networking-tests.xcresult
